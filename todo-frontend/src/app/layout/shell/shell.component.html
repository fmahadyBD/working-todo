<div class="shell" [class.collapsed]="!sidebarOpen">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <i class="fa-solid fa-list-check"></i>
      </div>
      <span class="brand-name" *ngIf="sidebarOpen">TaskFlow</span>
    </div>

    <nav class="nav">
      <a *ngFor="let item of nav"
         [routerLink]="item.path"
         routerLinkActive="active"
         class="nav-item">
        <i class="fa-solid nav-icon" [ngClass]="item.icon"></i>
        <span class="nav-label" *ngIf="sidebarOpen">{{ item.label }}</span>
      </a>
    </nav>

    <button class="collapse-btn" (click)="toggleSidebar()">
      <i class="fa-solid" [ngClass]="sidebarOpen ? 'fa-chevron-left' : 'fa-chevron-right'"></i>
    </button>
  </aside>

  <main class="main">
    <router-outlet />
  </main>
</div>
